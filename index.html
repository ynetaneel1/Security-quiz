<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>בוחן התמצאות גזרה - מגדל עוז</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #0f172a; color: #f8fafc; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100%; height: 100dvh; position: relative; }
    
    #map-container { flex: 1; width: 100%; position: relative; }
    #map { width: 100%; height: 100%; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000;
    }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
    .badge-admin { background: #3b82f6; color: white; }
    .badge-test { background: #10b981; color: white; }
    .timer-badge { background: #ef4444; color: white; font-family: monospace; font-size: 16px; padding: 4px 12px; }

    .action-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(15, 23, 42, 0.95); padding: 12px 16px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn {
      display: inline-flex; justify-content: center; align-items: center; width: 100%;
      padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; text-decoration: none; text-align: center;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .btn:active { transform: scale(0.98); opacity: 0.9; }

    .drawer {
      position: absolute; top: 50px; bottom: 0; right: 0; width: 100%; max-width: 380px;
      background: #1e293b; z-index: 1001; transform: translateX(100%); transition: transform 0.3s ease;
      display: flex; flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.4);
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header { padding: 14px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .drawer-content { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    
    .point-card {
      background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .point-card input {
      background: transparent; border: none; border-bottom: 1px dashed #64748b;
      color: white; font-size: 14px; width: 100%; padding: 4px; outline: none;
    }

    .time-up-banner {
      background: #ef4444; color: white; text-align: center; padding: 8px;
      font-weight: 700; font-size: 14px; display: none;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: #1e293b; border-radius: 12px; padding: 20px; width: 100%; max-width: 420px;
      max-height: 90vh; overflow-y: auto; border: 1px solid #334155; display: flex; flex-direction: column; gap: 14px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; color: #94a3b8; font-weight: 600; }
    .form-group input, .form-group select {
      background: #0f172a; border: 1px solid #334155; border-radius: 8px;
      padding: 10px; color: white; font-size: 14px; outline: none;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div id="status-badge" class="badge badge-admin">מצב רבש"צ - ניהול</div>
    <div id="timer-box" style="display:none;" class="badge timer-badge">02:00</div>
    <button id="btn-toggle-menu" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 13px;">הגדרות בוחן</button>
  </div>

  <div id="time-up-banner" class="time-up-banner">⚠️ תם הזמן! הסיכות ננעלו. יש ללחוץ על הגש בוחן.</div>

  <div id="map-container">
    <div id="map"></div>
  </div>

  <div id="action-panel" class="action-panel">
    <button id="btn-main-action" class="btn btn-primary">שתף בוחן למאבטחים</button>
  </div>

  <!-- סרגל צד לניהול נקודות -->
  <div id="drawer" class="drawer">
    <div class="drawer-header">
      <h3 style="font-size: 16px;">הגדרות בוחן גזרה</h3>
      <button id="btn-close-drawer" style="background:none; border:none; color:white; font-size: 22px; cursor: pointer;">&times;</button>
    </div>
    <div class="drawer-content">
      <div class="form-group">
        <label>שם הבוחן</label>
        <input type="text" id="cfg-quiz-title" value="בוחן התמצאות גזרת מגדל עוז">
      </div>
      <div class="form-group">
        <label>טלפון רבש"צ לקבלת תוצאות בווצאפ</label>
        <input type="tel" id="cfg-phone" value="053-7177033">
      </div>
      <div class="form-group">
        <label>זמן מוקצב</label>
        <select id="cfg-duration">
          <option value="60">דקה אחת (60 שניות)</option>
          <option value="90">דקה וחצי (90 שניות)</option>
          <option value="120" selected>2 דקות (120 שניות)</option>
          <option value="180">3 דקות (180 שניות)</option>
          <option value="300">5 דקות (300 שניות)</option>
        </select>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
        <h4 style="font-size: 14px; color: #94a3b8;">רשימת נקודות (לחץ במפה להוספה)</h4>
      </div>
      <div id="points-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
  </div>
</div>

<!-- מודאל כניסה למאבטח -->
<div id="guard-modal" class="modal-overlay">
  <div class="modal-box">
    <h3 id="guard-modal-title" style="text-align: center; color: #38bdf8;">בוחן התמצאות גזרה</h3>
    <div style="font-size: 14px; line-height: 1.5; color: #cbd5e1; text-align: center;">
      עליך לגרור את הסיכות במפה למיקום המדויק ביותר תוך הזמן המוקצב.
    </div>
    <div class="form-group">
      <label>שם מלא של המאבטח:</label>
      <input type="text" id="guard-name-input" placeholder="הזן שם מלא...">
    </div>
    <button id="btn-start-guard-quiz" class="btn btn-success">התחל בוחן כעת</button>
  </div>
</div>

<!-- מודאל שיתוף רבש"צ -->
<div id="share-modal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="text-align: center;">קישור לבוחן מוכן!</h3>
    <div style="font-size: 13px; color: #94a3b8; text-align: center;">הקישור מותאם ישירות לשליחה בוואטסאפ:</div>
    <input type="text" id="share-link-input" readonly style="background:#0f172a; border:1px solid #334155; padding:10px; color:white; border-radius:8px; font-size:12px; text-align:left;" dir="ltr">
    <button id="btn-send-whatsapp-link" class="btn btn-success">📲 שלח בוואטסאפ למאבטחים</button>
    <button id="btn-copy-link" class="btn btn-secondary">העתק קישור</button>
    <button id="btn-close-share" class="btn btn-secondary">סגור</button>
  </div>
</div>

<!-- מודאל תוצאות -->
<div id="results-modal" class="modal-overlay">
  <div class="modal-box">
    <h2 style="text-align:center; color:#38bdf8;">הבוחן הוגש!</h2>
    <div id="score-display" style="text-align:center; font-size:42px; font-weight:900; color:#4ade80; margin:10px 0;">0</div>
    <div id="results-breakdown" style="font-size:13px; max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
    <button id="btn-send-results-wa" class="btn btn-success">📲 שלח תוצאות לרבש"צ בוואטסאפ</button>
  </div>
</div>

<script>
  const MIGDAL_OZ = [31.6410, 35.1435];
  let map, isGuardMode = false, quizTimer = null, timeLeft = 120;
  let points = [
    { id: 1, name: "שער ראשי - כניסה למגדל עוז", lat: 31.64272, lng: 35.14198 },
    { id: 2, name: "חמ\"ל ביטחון ומזכירות", lat: 31.64105, lng: 35.14355 },
    { id: 3, name: "שער מזרחי / מטעים", lat: 31.64015, lng: 35.14675 },
    { id: 4, name: "מאגר מים / עמדה דרומית", lat: 31.63835, lng: 35.14390 },
    { id: 5, name: "פילבוקס צפוני", lat: 31.64295, lng: 35.14450 }
  ];
  let guardMarkers = [];
  let guardAnswers = [];

  // פונקציות קידוד בטוחות לוואטסאפ (מונעות שיבוש תווים)
  function safeEncode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function safeDecode(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    const bin = atob(str);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function initMap() {
    map = L.map('map', { zoomControl: false, attributionControl: false }).setView(MIGDAL_OZ, 16);
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);

    // בדיקת נתוני בוחן בכתובת (תומך גם ב-?q= וגם ב-#q=)
    const urlParams = new URLSearchParams(window.location.search);
    let rawQ = urlParams.get('q');
    if (!rawQ && window.location.hash) {
      const match = window.location.hash.match(/[#&]q=([^&]+)/);
      if (match) rawQ = match[1];
    }

    if (rawQ) {
      loadQuizFromData(rawQ);
    } else {
      setupAdminMode();
    }
  }

  // --- מצב מנהל ---
  function setupAdminMode() {
    document.getElementById('status-badge').textContent = 'מצב רבש"צ - ניהול';
    renderAdminMarkers();
    renderPointsList();

    document.getElementById('btn-toggle-menu').onclick = () => document.getElementById('drawer').classList.toggle('open');
    document.getElementById('btn-close-drawer').onclick = () => document.getElementById('drawer').classList.remove('open');

    map.on('click', (e) => {
      if (isGuardMode || points.length >= 10) return;
      points.push({ id: Date.now(), name: `נקודה ${points.length + 1}`, lat: e.latlng.lat, lng: e.latlng.lng });
      renderAdminMarkers();
      renderPointsList();
    });

    document.getElementById('btn-main-action').onclick = generateShareableLink;
  }

  let adminMarkers = [];
  function renderAdminMarkers() {
    adminMarkers.forEach(m => map.removeLayer(m));
    adminMarkers = [];

    points.forEach((p, idx) => {
      const marker = L.marker([p.lat, p.lng], { draggable: true }).addTo(map);
      marker.bindTooltip(`${idx + 1}. ${p.name}`, { permanent: true, direction: 'top' });
      marker.on('dragend', (ev) => {
        const pos = ev.target.getLatLng();
        p.lat = pos.lat;
        p.lng = pos.lng;
      });
      adminMarkers.push(marker);
    });
  }

  function renderPointsList() {
    const list = document.getElementById('points-list');
    list.innerHTML = '';
    points.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'point-card';
      card.innerHTML = `
        <span style="font-weight:bold; color:#38bdf8;">${idx + 1}.</span>
        <input type="text" value="${p.name}" onchange="updatePointName(${p.id}, this.value)">
        <button onclick="deletePoint(${p.id})" style="background:none; border:none; color:#ef4444; font-size:16px; cursor:pointer;">🗑️</button>
      `;
      list.appendChild(card);
    });
  }

  window.updatePointName = (id, newName) => {
    const p = points.find(x => x.id === id);
    if (p) p.name = newName;
    renderAdminMarkers();
  };

  window.deletePoint = (id) => {
    if (points.length <= 3) { alert('נדרשות לפחות 3 נקודות לבוחן.'); return; }
    points = points.filter(x => x.id !== id);
    renderAdminMarkers();
    renderPointsList();
  };

  function generateShareableLink() {
    // מבנה נתונים קומפקטי במיוחד (מערך שטוח חוסך תווים)
    const payload = [
      Date.now().toString(36), // מזהה בוחן ייחודי
      document.getElementById('cfg-quiz-title').value,
      document.getElementById('cfg-phone').value,
      parseInt(document.getElementById('cfg-duration').value),
      points.map(p => [p.name, Number(p.lat.toFixed(5)), Number(p.lng.toFixed(5))])
    ];

    const encoded = safeEncode(JSON.stringify(payload));
    const baseUrl = window.location.origin + window.location.pathname.split('?')[0].split('#')[0];
    const finalUrl = `${baseUrl}?q=${encoded}`;

    document.getElementById('share-link-input').value = finalUrl;
    document.getElementById('share-modal').style.display = 'flex';

    document.getElementById('btn-copy-link').onclick = () => {
      navigator.clipboard.writeText(finalUrl);
      alert('הקישור הועתק ללוח!');
    };

    const waText = `🛡️ *${payload[1]}*\nשלום, לפניך בוחן התמצאות גזרה (${payload[4].length} נקודות, זמן: ${Math.floor(payload[3]/60)} דק').\n\n🔗 קישור ישיר לבוחן:\n${finalUrl}\n\nבסיום יש להגיש את הבוחן ולשלוח את התוצאות. בהצלחה!`;
    document.getElementById('btn-send-whatsapp-link').onclick = () => {
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(waText)}`, '_blank');
    };

    document.getElementById('btn-close-share').onclick = () => document.getElementById('share-modal').style.display = 'none';
  }

  // --- מצב מאבטח ---
  let quizData = null;
  function loadQuizFromData(rawString) {
    try {
      const decoded = safeDecode(decodeURIComponent(rawString));
      const parsed = JSON.parse(decoded);
      
      quizData = {
        id: parsed[0],
        title: parsed[1],
        phone: parsed[2],
        duration: parsed[3],
        points: parsed[4]
      };

      isGuardMode = true;
      document.getElementById('status-badge').className = 'badge badge-test';
      document.getElementById('status-badge').textContent = 'מצב מאבטח - בוחן פעיל';
      document.getElementById('btn-toggle-menu').style.display = 'none';

      // בדיקת חסימת ניסיון נוסף
      const lockKey = `submitted_${quizData.id}`;
      if (localStorage.getItem(lockKey)) {
        document.body.innerHTML = `
          <div style="display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;">
            <h2 style="color:#ef4444;">⚠️ הבוחן כבר הוגש</h2>
            <p style="color:#94a3b8;">הבוחן הוגש ממכשיר זה ולא ניתן לבצע ניסיון נוסף.</p>
            <button onclick="localStorage.removeItem('${lockKey}'); location.reload();" style="margin-top:20px; background:#334155; border:none; color:#cbd5e1; padding:8px 14px; border-radius:8px; font-size:12px;">מצב בדיקה לרבש"צ (אפס נעילה)</button>
          </div>`;
        return;
      }

      document.getElementById('guard-modal').style.display = 'flex';
      document.getElementById('guard-modal-title').textContent = quizData.title;

      document.getElementById('btn-start-guard-quiz').onclick = () => {
        const name = document.getElementById('guard-name-input').value.trim();
        if (!name) { alert('נא להזין שם מלא'); return; }
        document.getElementById('guard-modal').style.display = 'none';
        startGuardExam(name);
      };
    } catch (err) {
      alert('קישור הבוחן שגוי או מקוטע.');
    }
  }

  function startGuardExam(guardName) {
    timeLeft = quizData.duration || 120;
    document.getElementById('timer-box').style.display = 'block';
    updateTimerDisplay();

    quizTimer = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        clearInterval(quizTimer);
        handleTimeUp();
      }
    }, 1000);

    points = quizData.points.map((p, idx) => ({ id: idx + 1, name: p[0], lat: p[1], lng: p[2] }));
    guardAnswers = points.map(p => ({ id: p.id, name: p.name, lat: MIGDAL_OZ[0], lng: MIGDAL_OZ[1] }));

    renderGuardMarkers();

    const mainBtn = document.getElementById('btn-main-action');
    mainBtn.textContent = 'הגש בוחן עכשיו';
    mainBtn.className = 'btn btn-danger';
    mainBtn.onclick = () => submitQuiz(guardName);
  }

  function updateTimerDisplay() {
    const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const secs = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timer-box').textContent = `${mins}:${secs}`;
  }

  function renderGuardMarkers() {
    guardMarkers.forEach(m => map.removeLayer(m));
    guardMarkers = [];

    points.forEach((p, idx) => {
      const offsetLat = (Math.random() - 0.5) * 0.002;
      const offsetLng = (Math.random() - 0.5) * 0.002;
      const startPos = [MIGDAL_OZ[0] + offsetLat, MIGDAL_OZ[1] + offsetLng];
      guardAnswers[idx].lat = startPos[0];
      guardAnswers[idx].lng = startPos[1];

      const marker = L.marker(startPos, { draggable: true }).addTo(map);
      marker.bindTooltip(`${idx + 1}. ${p.name}`, { permanent: true, direction: 'top' });

      marker.on('dragend', (ev) => {
        const pos = ev.target.getLatLng();
        guardAnswers[idx].lat = pos.lat;
        guardAnswers[idx].lng = pos.lng;
      });

      guardMarkers.push(marker);
    });
  }

  function handleTimeUp() {
    document.getElementById('time-up-banner').style.display = 'block';
    document.getElementById('timer-box').textContent = '00:00';
    guardMarkers.forEach(m => m.dragging && m.dragging.disable());
    map.dragging.disable();
    alert('הזמן תם! הסיכות ננעלו. לחץ על כפתור ההגשה בתחתית.');
  }

  function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const phi1 = lat1 * Math.PI / 180, phi2 = lat2 * Math.PI / 180;
    const deltaPhi = (lat2 - lat1) * Math.PI / 180, deltaLambda = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
              Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
    return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  function submitQuiz(guardName) {
    if (quizTimer) clearInterval(quizTimer);

    // נעילת ניסיון נוסף
    localStorage.setItem(`submitted_${quizData.id}`, 'true');

    let totalScore = 0;
    let reportRows = [];
    const breakdown = document.getElementById('results-breakdown');
    breakdown.innerHTML = '';

    points.forEach((truth, idx) => {
      const userLoc = guardAnswers[idx];
      const dist = getDistanceInMeters(truth.lat, truth.lng, userLoc.lat, userLoc.lng);

      let score = 0;
      if (dist <= 200) {
        score = Math.max(0, Math.round(100 - (dist / 200) * 100));
      }
      totalScore += score;

      reportRows.push(`📍 *${truth.name}*: סטייה ${dist} מטר (ציון: ${score})`);

      const row = document.createElement('div');
      row.style.cssText = 'background:#0f172a; padding:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;';
      row.innerHTML = `
        <div><b>${truth.name}</b><br><small style="color:#94a3b8;">סטייה: ${dist} מ'</small></div>
        <div style="font-weight:bold; color:${score > 70 ? '#4ade80' : score > 40 ? '#facc15' : '#ef4444'}">${score} נק'</div>
      `;
      breakdown.appendChild(row);
    });

    const finalScore = Math.round(totalScore / points.length);
    document.getElementById('score-display').textContent = `${finalScore}`;
    document.getElementById('results-modal').style.display = 'flex';

    const phone = quizData.phone ? quizData.phone.replace(/[^0-9]/g, '').replace(/^0/, '972') : '';
    const message = `📋 *תוצאות בוחן התמצאות גזרה*\n` +
                    `👤 מאבטח: *${guardName}*\n` +
                    `🎯 ציון סופי: *${finalScore} / 100*\n\n` +
                    `פירוט נקודות:\n` +
                    reportRows.join('\n');

    document.getElementById('btn-send-results-wa').onclick = () => {
      const waUrl = phone 
        ? `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(message)}`
        : `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
      window.open(waUrl, '_blank');
    };
  }

  window.onload = initMap;
</script>
</body>
